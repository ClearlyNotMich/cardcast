[package]
name = "cardcast"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = "0.37"

# The Linux monitor list (docs/research/linux-support.md, sections 4 and 8): the versions eframe already pulls in.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Mirror capture (#42): PipeWire streams from the ScreenCast portal. MIT.
pipewire = { version = "0.10", features = ["v0_3_65"] }
# libc (MIT OR Apache-2.0, the version eframe already pulls in): ending `pw-loopback` with cardcast
# (section 3) and the i2c-dev ioctl for DDC/CI (section 7). serde_json (MIT OR Apache-2.0): the sink
# list from `pw-dump`.
libc = "0.2"
serde_json = "1"

# PNG snapshots of the settings window, rendered on Linux (AGENTS.md, Build and test).
[target.'cfg(target_os = "linux")'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# unsafe is opt-in per module (mirror, guard, audio and input's ddc allow it) so it cannot spread to ui or logic.
unsafe_code = "deny"
# Every unsafe operation needs its own explicit block, even inside unsafe fns.
unsafe_op_in_unsafe_fn = "deny"
# Ignored Windows Result/HRESULTs are bugs.
unused_must_use = "deny"

[lints.clippy]
# The default set is the baseline; -D warnings in CI catches the rest.
all = { level = "deny", priority = -1 }
# Enforces the SPEC's // SAFETY: comment on every block.
undocumented_unsafe_blocks = "deny"
# A panic in a hook thread or message loop silently kills the guard or mirror (allowed in tests via clippy.toml).
unwrap_used = "deny"
# Fails CI unless silenced with #[expect(clippy::expect_used, reason = "why it cannot fail")].
expect_used = "deny"
# Every #[allow]/#[expect] must say why, so reviewers can judge it.
allow_attributes_without_reason = "deny"
# Monitor rectangles mix i32/u32 coordinates; silent truncation puts windows in the wrong place.
cast_possible_truncation = "deny"
# Monitor rectangles mix i32/u32 coordinates; a negative coordinate must not wrap silently.
cast_sign_loss = "deny"
# Keep casts explicit and visible.
cast_lossless = "warn"
# No debug code reaches the .exe.
dbg_macro = "deny"
# No placeholder code reaches the .exe.
todo = "deny"
# No placeholder code reaches the .exe.
unimplemented = "deny"
