name: CI

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The settings window snapshots render with wgpu on lavapipe, Mesa's software Vulkan.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test
      # The Linux monitor list on a desktop (#41): X11 on Xvfb, Wayland on headless sway with a hotplug.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb sway
      - if: runner.os == 'Linux'
        name: Monitor list on Xvfb
        env:
          CARDCAST_EXPECT_MONITORS: screen 1280x1024 1280x1024+0+0 primary
        run: xvfb-run -s '-screen 0 1280x1024x24' cargo test guard::linux::tests::desktop_lists -- --nocapture
      - if: runner.os == 'Linux'
        name: Monitor list and hotplug on headless sway
        env:
          WLR_BACKENDS: headless
          WLR_HEADLESS_OUTPUTS: 2
          WLR_LIBINPUT_NO_DEVICES: 1
          WLR_RENDERER: pixman
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          sway -c /dev/null &
          for _ in $(seq 50); do ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock >/dev/null 2>&1 && break; sleep 0.2; done
          export SWAYSOCK=$(ls "$XDG_RUNTIME_DIR"/sway-ipc.*.sock)
          export WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? | head -n 1)")
          # A turned, scaled output: its resolution is 720x1280, its size on the desktop 480x853.
          # sway can be slow to answer while it starts, so the first command is retried.
          for _ in $(seq 10); do swaymsg output HEADLESS-1 scale 1.5 transform 90 && break; sleep 1; done
          swaymsg -t get_outputs
          failed=0
          CARDCAST_EXPECT_MONITORS='HEADLESS-1 720x1280 480x853+1280+0; HEADLESS-2 1280x720 1280x720+0+0 primary' \
            cargo test guard::linux::tests::desktop_lists -- --nocapture || failed=1
          CARDCAST_PLUG_COMMAND='swaymsg create_output' CARDCAST_PLUGGED=HEADLESS-3 \
          CARDCAST_EXPECT_PLUGGED='HEADLESS-1 720x1280 480x853+1280+0; HEADLESS-2 1280x720 1280x720+0+0 primary; HEADLESS-3 1920x1080 1920x1080+1760+0' \
            cargo test guard::linux::tests::desktop_hotplug -- --nocapture || failed=1
          exit $failed
      # The window guard (#47) through EWMH: Xvfb split into two RandR monitors, with openbox.
      - if: runner.os == 'Linux'
        name: Window guard on Xvfb with openbox
        env:
          CARDCAST_GUARD_DESKTOP: openbox
        run: |
          sudo apt-get install -y openbox x11-xserver-utils x11-utils
          export DISPLAY=:99
          # -noreset: the X server would drop the monitors once the last client leaves.
          Xvfb :99 -screen 0 2560x1024x24 -noreset &
          for _ in $(seq 50); do xprop -root >/dev/null 2>&1 && break; sleep 0.2; done
          xrandr --setmonitor left 1280/338x1024/270+0+0 screen
          xrandr --setmonitor right 1280/338x1024/270+1280+0 none
          xrandr --listmonitors
          openbox &
          for _ in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK | grep -q window && break; sleep 0.2; done
          cargo test guard_tests -- --nocapture --test-threads=1
      # The audio relay (#44): PipeWire and WirePlumber with two null sinks, a tone played into one.
      - if: runner.os == 'Linux'
        name: Audio relay between two null sinks
        run: |
          sudo apt-get install -y pipewire pipewire-bin wireplumber
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- sh -ec '
            pipewire & wireplumber &
            for _ in $(seq 50); do wpctl status >/dev/null 2>&1 && break; sleep 0.2; done
            for sink in source card; do
              pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=cardcast-$sink node.nick=\"cardcast $sink\" media.class=Audio/Sink audio.position=[FL FR] object.linger=true }"
            done
            CARDCAST_NULL_SINKS=1 cargo test audio::linux::tests::null_sinks -- --nocapture
          '
      - run: cargo build --release
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: cardcast-exe
          path: target/release/cardcast.exe
      # A tarball keeps cardcast's executable bit, which the artifact zip would drop.
      - if: runner.os == 'Linux'
        run: |
          mkdir cardcast-linux-x86_64
          cp target/release/cardcast LICENSE README.md cardcast-linux-x86_64/
          mkdir cardcast-linux-x86_64/packaging && cp -r packaging/linux cardcast-linux-x86_64/packaging/
          tar -czf cardcast-linux-x86_64.tar.gz cardcast-linux-x86_64
          tar -tvzf cardcast-linux-x86_64.tar.gz | grep -q -- '-rwx.* cardcast-linux-x86_64/cardcast$'
          tar -tzf cardcast-linux-x86_64.tar.gz | grep -q 'packaging/linux/udev/rules.d/60-cardcast-i2c.rules$'
          tar -tzf cardcast-linux-x86_64.tar.gz | grep -q 'packaging/linux/modules-load.d/i2c-dev.conf$'
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: cardcast-linux-x86_64.tar.gz
          path: cardcast-linux-x86_64.tar.gz
      - if: runner.os == 'Windows'
        name: Check embedded DPI manifest
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName | Select-Object -Last 1
          & $mt.FullName -nologo "-inputresource:target\release\cardcast.exe;#1" "-out:extracted.manifest"
          if ($LASTEXITCODE -ne 0) { throw "no manifest embedded in cardcast.exe" }
          if (-not (Select-String -Path extracted.manifest -SimpleMatch -Quiet 'PerMonitorV2')) { throw "embedded manifest lacks PerMonitorV2 DPI awareness" }
      - if: runner.os == 'Windows'
        name: Check the release exe is a GUI program (no console window)
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("target\release\cardcast.exe")
          $subsystem = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3c) + 24 + 68)
          if ($subsystem -ne 2) { throw "cardcast.exe subsystem is $subsystem, expected 2 (Windows GUI)" }

  # The window guard's KWin script (#47) on kwin_wayland --virtual in an Arch container; see the script.
  kwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo modprobe udmabuf && ls -l /dev/udmabuf
      - run: docker run --rm --device /dev/udmabuf -v "$PWD:/src" archlinux:latest /src/.github/ci/kwin-guard.sh

  # Adds two virtual monitors (docs/research/ci-second-monitor.md) and runs the second_monitor tests.
  # The driver is third-party and its certificate becomes a trusted root, so this job gets no secrets and read-only access.
  second-monitor:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # No save: the job loads a third-party driver before the cache would be saved.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # Build before the driver is installed, so nothing the driver touches is compiled.
      - run: cargo test --no-run
      - name: Install the virtual display driver (VirtualDrivers/Virtual-Display-Driver 24.10.27)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/24.10.27/VirtualDisplayDriver-x64.zip -OutFile vdd.zip
          if ((Get-FileHash vdd.zip -Algorithm SHA256).Hash -ne 'B7A36F341F2A0CE43CC2AFE7894D30DD8FEF7B6F60EF9491AAB2EF77663A42FD') { throw 'sha256 mismatch' }
          Expand-Archive vdd.zip -DestinationPath vdd
          $pkg = "$PWD\vdd\VirtualDisplayDriver"
          Import-Certificate "$pkg\Virtual_Display_Driver.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate "$pkg\Virtual_Display_Driver.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          New-Item -ItemType Directory C:\VirtualDisplayDriver -Force | Out-Null
          # Two virtual monitors on one virtual graphics card: a source monitor and a card display.
          (Get-Content "$pkg\vdd_settings.xml") -replace '<count>1</count>', '<count>2</count>' | Set-Content C:\VirtualDisplayDriver\vdd_settings.xml
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class Dev {
            [StructLayout(LayoutKind.Sequential)] public struct SP_DEVINFO_DATA { public int cbSize; public Guid ClassGuid; public int DevInst; public IntPtr Reserved; }
            [DllImport("setupapi.dll", SetLastError=true)] static extern IntPtr SetupDiCreateDeviceInfoList(ref Guid g, IntPtr h);
            [DllImport("setupapi.dll", SetLastError=true, CharSet=CharSet.Unicode)] static extern bool SetupDiCreateDeviceInfoW(IntPtr s, string name, ref Guid g, string desc, IntPtr h, int flags, ref SP_DEVINFO_DATA d);
            [DllImport("setupapi.dll", SetLastError=true, CharSet=CharSet.Unicode)] static extern bool SetupDiSetDeviceRegistryPropertyW(IntPtr s, ref SP_DEVINFO_DATA d, int prop, byte[] buf, int size);
            [DllImport("setupapi.dll", SetLastError=true)] static extern bool SetupDiCallClassInstaller(int fn, IntPtr s, ref SP_DEVINFO_DATA d);
            [DllImport("newdev.dll", SetLastError=true, CharSet=CharSet.Unicode)] static extern bool UpdateDriverForPlugAndPlayDevicesW(IntPtr h, string hwid, string inf, int flags, out bool reboot);
            public static string Install(string hwid, string inf) {
              Guid g = new Guid("4d36e968-e325-11ce-bfc1-08002be10318");
              IntPtr s = SetupDiCreateDeviceInfoList(ref g, IntPtr.Zero);
              var d = new SP_DEVINFO_DATA(); d.cbSize = Marshal.SizeOf(d);
              if (!SetupDiCreateDeviceInfoW(s, "Display", ref g, null, IntPtr.Zero, 1, ref d)) return "create " + Marshal.GetLastWin32Error();
              byte[] b = System.Text.Encoding.Unicode.GetBytes(hwid + "\0\0");
              if (!SetupDiSetDeviceRegistryPropertyW(s, ref d, 1, b, b.Length)) return "hwid " + Marshal.GetLastWin32Error();
              if (!SetupDiCallClassInstaller(0x19, s, ref d)) return "register " + Marshal.GetLastWin32Error();
              bool r; if (!UpdateDriverForPlugAndPlayDevicesW(IntPtr.Zero, hwid, inf, 1, out r)) return "update " + Marshal.GetLastWin32Error();
              return "ok reboot=" + r;
            }
          }
          '@
          $result = [Dev]::Install('Root\MttVDD', "$pkg\MttVDD.inf")
          if ($result -ne 'ok reboot=False') { throw "driver install: $result" }
          Add-Type -AssemblyName System.Windows.Forms
          $deadline = (Get-Date).AddSeconds(60)
          while ([System.Windows.Forms.Screen]::AllScreens.Count -lt 3) {
            if ((Get-Date) -gt $deadline) { throw 'the two virtual monitors did not appear' }
            Start-Sleep -Milliseconds 500
          }
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "$($_.DeviceName) $($_.Bounds) primary=$($_.Primary)" }
          $id = (Get-PnpDevice | Where-Object HardwareID -contains 'Root\MttVDD').InstanceId
          "CARDCAST_SECOND_MONITOR=$id" >> $env:GITHUB_ENV
      # One at a time: the tests share the monitors, and one unplugs the second monitor.
      - run: cargo test second_monitor -- --test-threads=1
